e:56px;font-style:italic;color:#73013A'>Nur bei uns selbst tun wir so, als ginge beides.</p></div>"], "5": ["", "<div class='t' style='top:170px'><h1 style='font-size:76px'>Genau dafür gibt es jetzt ein Werkzeug.<em>Klein. Golden.<br>Und so klar.</em></h1><p class='s'>Der neue innerwise Hausarzt.<br>Erst in ein paar Wochen im Handel.</p></div><div style=\"position:absolute;left:50%;top:700px;transform:translateX(-50%);width:590px;height:590px;border-radius:50%;background:radial-gradient(circle,rgba(198,167,100,.35) 0%,rgba(198,167,100,0) 65%)\"></div><img src=\"box-cut.png\" style=\"position:absolute;left:50%;top:760px;transform:translateX(-50%) rotate(-4deg);width:470px;filter:drop-shadow(0 34px 40px rgba(0,0,0,.6))\">"], "6": ["light", "<div class='t' style='top:150px'><h1 style='font-size:80px'>Jede Testkarte hat zwei Seiten:<em>Dafür. Dagegen.</em></h1><p class='s'>Du findest heraus, wofür du dich entscheidest und wogegen. Und welches der 144 Gesundungsmittel dir die Kraft dafür gibt.</p></div><div class='ph' style='top:680px;width:540px'><img src='fan.jpg'></div>"], "7": ["", "<div class='t' style='top:150px'><h1 style='font-size:76px'>Beim innerwise-Mentorentreffen durften wir ihn testen.<em>Ich war völlig beeindruckt.</em></h1><p class='s'>Von seiner Tiefe. Von seiner Klarheit.<br>Den Golden Circle hat er fast schon integriert:<br>erst das Warum, dann alles andere.</p></div><div class='ph' style='top:690px;width:740px'><img src='open-hq.jpg'></div>"], "8": ["", "<div class='t' style='top:230px'><p class='kick'>Lass ihn uns zusammen auspacken</p><h1 style='font-size:84px'>Goldene Dienstage<em>mit dem Hausarzt</em></h1><div class='big'>195 €</div><p class='s' style='margin-top:0;font-size:30px'>inkl. MwSt. · Versand innerhalb Deutschlands inklusive</p><ul style='margin-top:20px'><li>4 Dienstage live via Zoom, ab 10.11., 10:30 – 12:00</li><li>Dein Hausarzt kommt zu dir, bevor es ihn im Handel gibt</li><li>Aufzeichnungen unbegrenzt · Telegram-Gruppe</li><li>Neu bei mir? Starte mit dem Kurs im Heilen und buch die Goldenen Dienstage dazu.</li></ul><p class='s' style='color:#C6A764;font-weight:600;margin-top:24px'>Bestellbar bis Dienstag, 3. November</p></div>"], "9": ["", "<div class='t' style='top:360px'><h1>Kommentiere</h1><div class='pill'>HAUSARZT</div><p class='s' style='margin-top:40px'>und ich schick dir alle Infos.</p><p class='s' style='margin-top:80px;color:#C6A764;font-weight:600'>Die Goldenen Dienstage gibt es nur dieses eine Mal.</p></div>"]};const [k,num,tot]=location.hash.slice(1).split('_');document.body.className=S[k][0];document.getElementById('c').innerHTML=`<div class="brand">AISUN DODENHOFF</div><div class="n">${num}/${tot}</div>`+S[k][1]+(num!==tot?'<div class="swipe">WISCHEN →</div>':'');</script></body></html>
