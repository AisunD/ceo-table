<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(70% 45% at 50% 52%,#3a2e17 0%,#1A1A1A 70%);color:#FBFAF0;font-family:Raleway,sans-serif;position:relative}
.brand{position:absolute;top:240px;width:100%;text-align:center;font-family:"Bodoni Moda",serif;color:#C6A764;letter-spacing:.32em;font-size:28px}
h1{position:absolute;top:300px;width:100%;text-align:center;font-family:"Bodoni Moda",serif;font-weight:500;font-variation-settings:"opsz" 11;font-size:96px;line-height:1.02}
h1 em{display:block;color:#C6A764;font-style:italic}
.phone{position:absolute;left:240px;top:560px;width:600px;height:1040px;border-radius:78px;background:#0c0c0c;padding:20px;box-shadow:0 0 0 2px rgba(198,167,100,.55),0 40px 90px rgba(0,0,0,.65)}
.screen{position:relative;width:560px;height:1000px;border-radius:60px;overflow:hidden;background:#FBFAF0;border-top:56px solid #1A1A1A}
.screen img.page{position:absolute;left:0;top:0;width:560px;animation:scroll 16s ease-in-out .6s forwards}
.notch{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:150px;height:38px;border-radius:20px;background:#0c0c0c;z-index:3}
.cta{position:absolute;left:24px;right:24px;bottom:26px;z-index:3;text-align:center;border-radius:999px;padding:20px 10px;font-weight:700;letter-spacing:.12em;font-size:20px;color:#1A1A1A;background:linear-gradient(115deg,#a88a4c 0%,#C6A764 28%,#efe2bf 50%,#C6A764 72%,#9d7f43 100%);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.box{position:absolute;left:760px;top:1330px;width:262px;transform:rotate(-7deg);filter:drop-shadow(0 26px 30px rgba(0,0,0,.55));z-index:5}
.foot{position:absolute;top:1640px;width:100%;text-align:center}
.foot p{font-size:30px;font-weight:600}
.foot b{display:block;margin-top:10px;color:#C6A764;font-size:30px;letter-spacing:.04em}
@keyframes scroll{0%{transform:translateY(0)}10%{transform:translateY(0)}32%{transform:translateY(-1660px)}42%{transform:translateY(-1660px)}64%{transform:translateY(-2860px)}74%{transform:translateY(-2860px)}100%{transform:translateY(-4240px)}}
</style></head><body>
<div class="brand">AISUN DODENHOFF</div>
<h1>Goldene Dienstage<em>mit dem Hausarzt.</em></h1>
<div class="phone"><div class="screen"><div class="notch"></div><img class="page" src="lp-top.jpg" alt=""><div class="cta">PLATZ SICHERN · 195 €</div></div></div>
<img class="box" src="box-cut.png" alt="">
<div class="foot"><p>Nur für alle, die schon mit mir arbeiten</p><b>Bestellbar bis Dienstag, 3. November</b></div>
</body></html>
