<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(70% 40% at 50% 60%,#3a2e17 0%,#1A1A1A 72%);color:#FBFAF0;font-family:Raleway,sans-serif;position:relative}
.brand{position:absolute;top:240px;width:100%;text-align:center;font-family:"Bodoni Moda",serif;color:#C6A764;letter-spacing:.32em;font-size:28px}
.txt{position:absolute;top:310px;left:90px;right:90px;text-align:center}
h1{font-family:"Bodoni Moda",serif;font-weight:500;font-variation-settings:"opsz" 11;font-size:88px;line-height:1.05}

.foot{position:absolute;width:100%;text-align:center;font-size:30px;font-weight:600}

.sticker{position:absolute;left:50%;transform:translateX(-50%);border:2px dashed rgba(198,167,100,.55);border-radius:28px;width:560px;height:110px;display:flex;align-items:center;justify-content:center;color:rgba(198,167,100,.75);font-size:26px;letter-spacing:.06em}
</style></head><body>
<div class="brand">AISUN DODENHOFF</div>

<div class="card" style="top:880px;width:860px"><img src="open-crop.jpg"></div>

};
document.getElementById('c').innerHTML=F[location.hash.slice(1)];
