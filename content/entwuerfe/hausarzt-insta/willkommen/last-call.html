<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..700;1,6..96,500..700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(70% 40% at 50% 55%,#3d301a 0%,#1A1A1A 72%);color:#FBFAF0;font-family:Raleway,sans-serif;text-align:center;position:relative}
.brand{position:absolute;top:250px;width:100%;font:700 32px 'Bodoni Moda',serif;color:#C6A764;letter-spacing:.32em}
.board{position:absolute;top:330px;left:130px;right:130px;border:3px solid #C6A764;border-radius:18px;padding:26px 20px 22px;background:rgba(0,0,0,.45)}
.board small{display:block;font:700 24px Raleway;letter-spacing:.3em;color:#C6A764}
.board b{display:block;white-space:nowrap;font:700 62px Raleway;letter-spacing:.12em;margin-top:8px;color:#FBFAF0}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;background:#C6A764;margin-right:16px;vertical-align:middle;box-shadow:0 0 18px #C6A764}
h1{position:absolute;top:640px;width:100%;font:600 80px/1.08 'Bodoni Moda',serif;font-variation-settings:'opsz' 11}
h1 em{display:block;color:#C6A764;font-style:italic;margin-top:10px}
.glow{position:absolute;left:50%;top:960px;transform:translateX(-50%);width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(198,167,100,.38) 0%,rgba(198,167,100,0) 65%)}
.box{position:absolute;left:50%;top:980px;transform:translateX(-50%) rotate(3deg);width:340px;filter:drop-shadow(0 34px 40px rgba(0,0,0,.6))}
.txt{position:absolute;top:1385px;width:100%;font:600 36px/1.4 Raleway}
.cta{position:absolute;top:1540px;width:100%}
.kwp{display:inline-block;background:linear-gradient(115deg,#a88a4c,#C6A764 30%,#efe2bf 50%,#C6A764 70%,#9d7f43);color:#1A1A1A;font:700 40px Raleway;letter-spacing:.08em;padding:22px 44px;border-radius:999px}
.cta p{font:600 28px Raleway;margin-top:18px;letter-spacing:.04em}
</style></head><body>
<div class="brand">AISUN DODENHOFF</div>
<div class="board"><small>WARTEZIMMER · GOLDENE DIENSTAGE</small><b><span class="dot"></span>LAST CALL</b></div>
<h1>Der Nächste, bitte.<em>Nur noch bis heute Mittag.</em></h1>
<div class="glow"></div><img class="box" src="box-cut.png" alt="">
<div class="txt">Kein Termin. Kein Wartezimmer.<br>Nur du und deine goldene Box.</div>
<div class="cta"><div class="kwp">Schreib mir HAUSARZT</div><p>Bestellbar bis heute Mittag · Start Di, 10.11., 10:30 Uhr</p></div>
</body></html>
