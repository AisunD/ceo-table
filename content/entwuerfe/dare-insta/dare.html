</style></head><body><div id='c'></div><script>const S={"1": ["", "<div class='t' style='top:340px'><h1 style='font-size:100px'>„Heiligabend oder erster Feiertag?“</h1><p class='s' style='font-family:Bodoni Moda,serif;font-size:58px;margin-top:40px'>Diese Frage hat schon für dich <span class='gold' style='font-style:italic'>entschieden.</span></p><p class='s' style='margin-top:60px'>Manipulation, die sich wie Freiheit anfühlt.<br>Fast niemand merkt sie.</p></div>"], "2": ["", "<div class='t' style='top:380px'><h1>Ob du überhaupt kommen willst,<em>hat dich niemand gefragt.</em></h1><p class='s' style='margin-top:50px'>Du rechnest schon: Wer fährt, wer kocht, wie lange.<br>Die eigentliche Frage ist weg.<br>Und nicht nur an Weihnachten.</p></div>"], "3": ["light", "<div class='t' style='top:170px'><h1 style='font-size:76px'>Du hörst diese Frage<em>öfter, als du denkst.</em></h1><div style='margin-top:110px;text-align:left'><div class='bub'>Still oder mit Sprudel?</div><br><div class='bub'>Schaffst du das bis Donnerstag oder Freitag?</div><br><div class='bub'>Backst du Muffins oder bringst du Obst mit?</div><div style='text-align:right'><div class='bub me'>Freitag.</div></div></div></div>"], "4": ["light", "<div class='t' style='top:330px'><h1 style='font-size:88px'>Und jetzt der Teil, der wehtut:<em>Du kannst das auch.</em></h1><p class='s' style='margin-top:50px'>„Willst du zuerst Zähne putzen oder Schlafanzug anziehen?“<br><br>Funktioniert bei Kindern.<br>Und bei Erwachsenen genauso gut.</p></div>"], "5": ["beere", "<div class='t' style='top:300px'><h1 style='font-size:88px'>Manipulation ist selten böse.<em>Meistens ist sie unbewusst.</em></h1><p class='s' style='font-family:Bodoni Moda,serif;font-size:52px;margin-top:20px'>Auf beiden Seiten.</p><p class='s' style='margin-top:50px'>Niemand hat diesen Satz gelernt, um dich reinzulegen. Er ist einfach praktisch. Gefährlich wird er erst, wenn du nicht mehr merkst, dass du wählen darfst.</p></div>"], "6": ["light", "<div class='split' style='top:200px'><h1 style='font-size:68px'>„Kommst du Heiligabend?“</h1><p class='s'>Da spürst du sofort, ob Ja oder Nein.</p></div><div class='line'></div><div class='split' style='top:760px'><h1 style='font-size:68px'>„Heiligabend<em>oder Feiertag?“</em></h1><p class='s'>Da fragst du deinen Bauch gar nicht mehr. Du planst nur noch. In Verkaufsschulungen heißt das: Alternativfrage.</p></div>"], "7": ["light", "<div class='t' style='top:260px'><p class='s' style='margin:0 0 30px;font-weight:700;letter-spacing:.14em;font-size:28px' class='bee'>BEVOR DU A ODER B SAGST</p><h1 style='font-size:84px'>Stell dir die dritte Frage:<em>„Will ich das überhaupt?“</em></h1><p class='s' style='margin-top:50px'>Spür kurz rein: Wird es eng oder weit?<br><br>Und wenn du es nicht weißt:<br><b>„Ich sag dir morgen Bescheid.“</b><br>Das ist ein ganzer Satz.</p></div>"], "8": ["beere", "<div class='t' style='top:420px'><h1 style='font-size:100px'>Wer dir zwei Türen zeigt,<em>hat die dritte schon zugemacht.</em></h1><p class='s' style='margin-top:50px'>Du darfst sie wieder aufmachen.</p></div>"], "9": ["light", "<div class='t' style='top:430px'><h1 style='font-size:84px'>Schick das der Frau,<em>die Heiligabend schon zugesagt hat.</em></h1><p class='s' style='margin-top:40px'>Bevor sie überhaupt gefragt wurde, ob sie will.</p></div>"]};const [k,num,tot]=location.hash.slice(1).split('_');document.body.className=S[k][0];document.getElementById('c').innerHTML=`<div class="brand">AISUN DODENHOFF</div><div class="n">${num}/${tot}</div>`+S[k][1]+(num!==tot?'<div class="swipe">WISCHEN →</div>':'');</script></body></html>
